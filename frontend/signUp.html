<!DOCTYPE html>
<html>
    <head>
        <title>Tomato Sign Up</title>
    </head>
    <h1> Create Account </h1>
    <body>    
        <form id="signUp">
            <label> First Name: </label>
            <input type="text" placeholder="John" id="firstName" name="firstName" required>
            <br>
            <label> Last Name: </label>
            <input type="text" placeholder="Doe" id="lastName" name="lastName" required>
            <br><br>
            <label> Phone Number: </label>
            <input type="number" placeholder="enter your mobile number" id="phoneNumber" name="phoneNumber" required>  
            <br><br>                   
            <label>Email: </label>
            <input type="email" placeholder="enter your email" id="email" name="email" required>
            <br>
            <label> Password: </label>
            <input type="password" placeholder="enter your password" id="password" name="password" required>
            <br>
            <br>
            <button type="submit"> Sign Up </button>
        </form>
    <script src="signUp.js"></script>
    </body>
</html>
