<!DOCTYPE html>
<html>
    <head>
        <title>Tomato Sign Up</title>
    </head>
    <h1> Create Account </h1>
    <body>    
        <form id="create">
            <label>Email: </label>
            <input type="email" placeholder="enter your email" id="email" name="email" required>
            <br>
            <label> License No:  </label>
            <input type="text" placeholder="enter your license no" id="licenseNo" name="licenseNo" required>
            <br><br>               
            <label>Name of restaurant: </label>
            <input type="text" placeholder="enter restaurant name" id="nameRestaurant" name="nameRestaurant" required>
            <br>
            <label> Address: </label>
            <input type="text" placeholder="enter your restaurant address" id="address" name="address" required>
            <br>
            <br>
            <button type="submit"> Create Restaurant Page </button>
        </form>
   <script src="restaurantScript.js"></script>
    </body>
</html>
